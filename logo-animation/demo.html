<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>АРКА 123 · анимация логотипа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* Повторный визит за сессию: прячем лоадер до первой отрисовки. #intro в адресе показывает его снова. */
try { if (sessionStorage.getItem('arka_visited') === '1' && location.hash !== '#intro') document.documentElement.classList.add('arka-skip'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: лоадер на весь экран поверх лендинга; липкая шапка с компактным логотипом */
:root{
  --navy:#213641; --cream:#F3EFE8; --brass:#B08D5B;
  --bg:#F6F3EE; --surface:#FFFFFF; --fg:#1C2C35; --muted:#5D6C74; --line:#E2DCD2;
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif; --f-body:"Roboto","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121D24;--surface:#18262F;--fg:#ECE7DE;--muted:#9FAAB0;--line:#2A3B45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121D24;--surface:#18262F;--fg:#ECE7DE;--muted:#9FAAB0;--line:#2A3B45;color-scheme:dark}
*{box-sizing:border-box}
html.is-loading{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* логотип */
.arka{display:block;width:100%;height:auto;overflow:visible;--arka-ink:currentColor}
.arka .ink path{stroke:var(--arka-ink)}
.arka .one,.arka .lt{fill:var(--arka-ink)}
.arka .slogan{fill:var(--arka-ink);font-family:var(--f-body)}
.arka .glint{stroke:var(--arka-glow,#fff)}
.arka .spark{fill:var(--arka-glow,#fff)}
.arka .curtain,.arka .hole,.arka--compact .slogan,.arka--compact .lt-d1,.arka--compact .lt-d2,.arka--compact .lt-d3,.arka--mark .word,.arka--mark .slogan{display:none}

/* лоадер: в цвете фона сайта, чтобы при пролёте не было скачка яркости */
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:24px;background:var(--bg);color:var(--fg);--arka-glow:var(--brass);overflow:hidden}
.loader.is-cut{background:transparent}
.arka-skip .loader{display:none}
.loader .arka .curtain,.loader .arka .hole{display:block;fill:var(--bg)}
.loader [data-arka-loader]{width:clamp(120px,18vw,180px)}
.loader .count{position:relative;z-index:1;font:500 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-variant-numeric:tabular-nums}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;padding-block:12px}
.brand{display:block;width:46px;color:var(--fg);--arka-glow:var(--brass);border-radius:6px;outline-offset:6px}
.brand:focus-visible{outline:2px solid var(--brass)}
.nav{display:flex;gap:24px;margin-left:auto;font-size:15px}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--fg)}
.cta{font:500 14px/1 var(--f-body);padding:12px 18px;border-radius:999px;background:var(--navy);color:var(--cream);text-decoration:none}
@media (max-width:760px){.nav{display:none}.cta{margin-left:auto}.brand{width:40px}}

/* место под контент лендинга */
.hero{padding-block:clamp(48px,10vw,120px);display:grid;gap:20px}
.hero h1{font:800 clamp(34px,6vw,64px)/1.08 var(--f-display);margin:0;text-wrap:balance;max-width:16ch}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:52ch}
.replay{justify-self:start;display:inline-flex;align-items:center;gap:10px;font:500 15px/1 var(--f-body);padding:13px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.replay::before{content:"";width:0;height:0;border-left:8px solid var(--brass);border-top:5px solid transparent;border-bottom:5px solid transparent}
.replay:hover{border-color:var(--brass)}
.replay:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
</style>

  </section>
</main>

      const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect();
      const ox = (57.8 + 624.75 * .6 - vb.x) / vb.width, oy = (51 + 760 * .6 - vb.y) / vb.height;
      overlay.classList.add('is-cut');
      gsap.killTweensOf([el.light, el.frame]);
      gsap.set(el.light, { opacity: 0 });
      const tl = gsap.timeline({ onComplete: done })
        .to([...el.digits, el.light], { opacity: 0, duration: .2, ease: 'sine.in' }, 0)
        .to(el.hole, { opacity: 0, duration: .25, ease: 'sine.in' }, 0)
        .to(svg, {
          scale: 6, x: innerWidth / 2 - (r.left + r.width * ox), y: innerHeight / 2 - (r.top + r.height * oy),
          transformOrigin: `${ox * 100}% ${oy * 100}%`, duration: .7, ease: 'power2.inOut'
        }, 0)
        .to(el.frame, { opacity: 0, duration: .22, ease: 'sine.out' }, 0)
        .to(overlay, { opacity: 0, duration: .45, ease: 'sine.inOut' }, .2);
      if (reveal) tl.from(reveal, { opacity: 0, y: 10, duration: .5, ease: 'sine.out', clearProps: 'all' }, .2);
      return tl;
    }

    // Ховер, ~0,9 с: блик по стеклу и по арке, цифры и буквы по очереди подпрыгивают
    let hoverTl = null;
    function hover() {
      if (reduce() || (hoverTl && hoverTl.isActive())) return;
      hoverTl = gsap.timeline()
        .set(el.glint, { opacity: 1, strokeDashoffset: 140 }, 0)
        .to(el.glint, { strokeDashoffset: -G, duration: .9, ease: 'power1.inOut' }, 0)
        .set(el.glint, { opacity: 0 })
        .fromTo(el.band, { x: 0 }, { x: 1500, duration: .9, ease: 'power2.inOut' }, 0)
        .to(el.digits, { y: -34, duration: .2, ease: 'power2.out', stagger: .06, yoyo: true, repeat: 1 }, .1)
        .to(el.letters, { y: -26, duration: .18, ease: 'power2.out', stagger: .04, yoyo: true, repeat: 1 }, .2);
    }
    function bindHover(target = svg) {
      target.addEventListener('mouseenter', hover);
      target.addEventListener('focus', hover);
    }

    return { svg, intro, pulse, exit, hover, bindHover };
  }

  // Лоадер: сборка стартует сразу; пролёт начинается, когда прошло 600 мс и сработал window.onload.
  // Быстрая связь: 0,6 с сборки + 0,6 с пролёта. Медленная: арка пульсирует, пока страница догружается.
  const minTimer = ms => new Promise(r => setTimeout(r, ms));
  const pageLoaded = () => new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true }));

  // Лоадер показывается один раз за сессию. Флаг ставится в <head> заранее (см. skipLoader), чтобы
  // при перезагрузке оверлей не мелькнул ни на кадр.
  const VISITED = 'arka_visited';
  function skipLoader() {
    try { return sessionStorage.getItem(VISITED) === '1' && location.hash !== '#intro'; } catch (e) { return false; }
  }

  function runLoader(overlay, { counter, reveal, minTime = 600, force = false } = {}) {
    if (force) document.documentElement.classList.remove('arka-skip');
    else if (document.documentElement.classList.contains('arka-skip') || skipLoader()) { overlay.remove(); return Promise.resolve(); }
    try { sessionStorage.setItem(VISITED, '1'); } catch (e) {}
    const logo = mount(overlay.querySelector('[data-arka-loader]'), { mark: true });
    document.documentElement.classList.add('is-loading');
    if (counter) { const n = { v: 0 }; gsap.to(n, { v: 123, duration: .5, ease: 'power2.out', onUpdate: () => counter.textContent = Math.round(n.v) }); }
    let waiting = null;
    logo.intro().then(() => { waiting = logo.pulse(); });
    return Promise.all([minTimer(minTime), pageLoaded()]).then(() => {
      if (waiting) waiting.kill();
      gsap.set(overlay.querySelector('.frame'), { opacity: 1 });
      if (counter) gsap.to(counter.parentNode, { opacity: 0, duration: .15 });
      document.documentElement.classList.remove('is-loading');
      return logo.exit(overlay, reveal);
    });
  }

  window.ArkaLogo = { mount, runLoader };
})();

</script>
<script>
(function () {
  const loader = document.getElementById('loader');
  if (!window.gsap) { loader.remove(); document.getElementById('replay').hidden = true; return; }
  const template = loader.cloneNode(true);
  const play = (force) => {
    const el = document.getElementById('loader') || document.body.prepend(template.cloneNode(true)) || document.getElementById('loader');
    return ArkaLogo.runLoader(el, { counter: el.querySelector('#arkaCount'), reveal: document.querySelector('.hero'), force });
  };
  ArkaLogo.mount(document.getElementById('brand'), { mark: true }).bindHover(document.getElementById('brand'));
  play(false);
  let busy = false;
  document.getElementById('replay').addEventListener('click', () => {
    if (busy) return; busy = true;
    scrollTo(0, 0);
    play(true).then(() => { busy = false; });
  });
})();
</script>

</body></html>
